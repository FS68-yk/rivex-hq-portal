<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jim 共建角色與合作方式確認問卷 - RIVEX</title>

  <script>
    if (window.RivexAuth?.getSession?.()?.role === "admin") {
      window.location.replace("rivex-admin-dashboard.html");
    } else if (window.RivexAuth) {
      window.RivexAuth.requireRole("jim");

  <script src="rivex-jim-questionnaire-schema.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f3ea;
      --muted: #aeb8c7;
      --quiet: #737f90;
      --night: #05070b;
      --surface: #0d1118;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.24);
      --cyan: #36d6d8;
      --gold: #e4b85c;
      --violet: #8f7cff;
      --green: #68d391;
      --rose: #ff6b7a;
      --orange: #ff9f43;
      --blue: #4ea1ff;
      --radius: 8px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(5, 7, 11, 0.96), rgba(7, 9, 13, 0.985)),
        linear-gradient(135deg, rgba(228, 184, 92, 0.1), transparent 34%, rgba(54, 214, 216, 0.08) 78%, transparent),
        #05070b;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 68px 68px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      color: inherit;
      font: inherit;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3,
    p,
    span,
    strong,
    label {
      overflow-wrap: anywhere;
    }

    .page-shell {
      width: min(1100px, calc(100% - clamp(24px, 5vw, 56px)));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 7, 11, 0.9);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(228, 184, 92, 0.46);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(228, 184, 92, 0.24), rgba(54, 214, 216, 0.12));
      color: var(--gold);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .brand-title {
      display: block;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.15;
    }

    .brand-subtitle {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: max-content;
    }

    .ghost-link,
    .button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      cursor: pointer;
      padding: 9px 11px;
      font-size: 13px;
      white-space: nowrap;
    }

    .button {
      min-height: 44px;
      color: var(--ink);
    }

    .button.primary {
      border-color: rgba(228, 184, 92, 0.52);
      background: linear-gradient(135deg, rgba(228, 184, 92, 0.22), rgba(54, 214, 216, 0.12));
      font-weight: 900;
    }

    .button.danger {
      border-color: rgba(255, 107, 122, 0.34);
      color: #ffc0c7;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .shell {
      padding: 34px 0 46px;
      display: grid;
      gap: 18px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.42fr);
      gap: 18px;
      align-items: end;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.04;
      margin-bottom: 14px;
    }

    .lead {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 0;
      max-width: 860px;
    }

    .status-panel,
    .question-card,
    .final-card {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.03)),
        rgba(13, 17, 24, 0.84);
      box-shadow: var(--shadow);
    }

    .status-panel {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .status-panel strong {
      color: var(--ink);
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .status-panel span {
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-track i {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.2s ease;
    }

    .module-tabs {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
    }

    .module-dot {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--quiet);
      padding: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
    }

    .module-dot.active {
      border-color: color-mix(in srgb, var(--accent, var(--gold)) 62%, var(--line));
      color: var(--accent, var(--gold));
      background: color-mix(in srgb, var(--accent, var(--gold)) 13%, #101827);
    }

    .question-card {
      overflow: hidden;
    }

    .question-head {
      display: grid;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 18px;
    }

    .question-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .pill {
      border: 1px solid color-mix(in srgb, var(--accent, var(--gold)) 54%, var(--line));
      border-radius: 999px;
      color: var(--accent, var(--gold));
      padding: 4px 8px;
    }

    .question-head h2 {
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.18;
      margin-bottom: 0;
    }

    .question-body {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .option-list {
      display: grid;
      gap: 9px;
    }

    .option-card {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      padding: 11px 12px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .option-card:has(input:checked) {
      border-color: color-mix(in srgb, var(--accent, var(--gold)) 58%, var(--line));
      background: color-mix(in srgb, var(--accent, var(--gold)) 12%, rgba(255, 255, 255, 0.035));
      color: var(--ink);
    }

    .option-card input {
      margin-top: 5px;
      accent-color: var(--gold);
    }

    .other-input,
    .text-input,
    .text-area,
    .rank-select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      outline: none;
    }

    .other-input,
    .text-input,
    .rank-select {
      min-height: 42px;
      padding: 8px 10px;
    }

    .other-input {
      grid-column: 2;
      margin-top: 4px;
    }

    .text-area {
      min-height: min(38vh, 260px);
      resize: vertical;
      padding: 12px;
    }

    .matrix-table {
      display: grid;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .matrix-head,
    .matrix-line {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) repeat(5, minmax(44px, 0.18fr));
      align-items: center;
    }

    .matrix-head {
      background: rgba(255, 255, 255, 0.055);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .matrix-head span,
    .matrix-line span,
    .matrix-line label {
      padding: 10px;
    }

    .matrix-line {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 13px;
    }

    .matrix-line label {
      display: grid;
      place-items: center;
    }

    .matrix-line input {
      accent-color: var(--gold);
    }

    .ranking-list {
      display: grid;
      gap: 8px;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 126px;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      padding: 10px 12px;
    }

    .helper {
      color: var(--quiet);
      font-size: 12px;
      margin: 0;
    }

    .wizard-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding: 14px 18px;
    }

    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .final-card {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .final-card h2 {
      font-size: 32px;
      line-height: 1.15;
      margin-bottom: 0;
    }

    .final-card p {
      color: var(--muted);
      margin-bottom: 0;
    }

    .submit-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .field-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .report-preview {
      display: grid;
      gap: 10px;
    }

    .report-preview[hidden] {
      display: none;
    }

    .report-output {
      width: 100%;
      min-height: 260px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(5, 7, 11, 0.62);
      color: var(--muted);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      padding: 12px;
      resize: vertical;
    }

    .footer {
      border-top: 1px solid var(--line);
      color: var(--quiet);
      font-size: 13px;
      padding: 24px 0 38px;
    }

    @media (max-width: 820px) {
      .topbar-inner,
      .intro,
      .submit-grid {
        align-items: stretch;
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        display: grid;
      }

      .top-actions,
      .wizard-actions,
      .action-group {
        justify-content: stretch;
      }

      .ghost-link,
      .button {
        width: 100%;
      }

      .module-tabs {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .matrix-table {
        overflow-x: auto;
      }

      .matrix-head,
      .matrix-line {
        min-width: 560px;
      }

      .ranking-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <main class="shell page-shell">
    <section class="intro">
      <div>
        <div class="eyebrow">Confirmation Form</div>

        <p class="lead">这份表单用于更完整地了解你对公司方向、未来角色、投入方式及合作结构的想法。每次只显示一题，答案会自动保存。</p>

  <script>
    const ALIGNMENT_STORAGE_KEY = "rivex-jim-alignment-form-v1";
    const RECIPIENT_STORAGE_KEY = "rivex-jim-alignment-recipient-v1";
    const LAST_REPORT_KEY = "rivex-jim-alignment-last-report-v1";
    const DEFAULT_REPORT_EMAIL = "yik@moce.io";
    const EMAIL_FUNCTION_ENDPOINT = "/.netlify/functions/send-jim-questionnaire";
    const STATE_FUNCTION_ENDPOINT = "/.netlify/functions/rivex-questionnaire-state";
    const RESPONDENT_ID = "jim-kok";
    const RESPONDENT_NAME = "Jim Kok";
    const REMOTE_SYNC_DELAY = 900;
    const schema = window.RivexJimQuestionnaire || { modules: [], questions: [] };
    const modules = schema.modules;
    const questions = schema.questions;

    let currentIndex = 0;
    let answers = {};
    let saveTimer;
    let remoteSyncTimer;
    let lastRemoteFingerprint = "";
    let latestLocalUpdatedAt = "";

    const wizardMount = document.getElementById("wizardMount");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const saveStatus = document.getElementById("saveStatus");
    const moduleTabs = document.getElementById("moduleTabs");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeGet(key, fallback = "") {
      try {
        return localStorage.getItem(key) ?? fallback;
      } catch (error) {
        return fallback;
      }
    }

    function safeSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        // Static file previews can still work without local storage.
      }
    }

    function safeRemove(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        // Ignore local storage restrictions.
      }
    }

    function canUseRemoteState() {
      return window.location.protocol !== "file:";
    }

    function timestampValue(value) {
      const time = Date.parse(value || "");
      return Number.isNaN(time) ? 0 : time;
    }

    function snapshotFingerprint(snapshot) {
      return JSON.stringify({
        status: snapshot.status,
        currentIndex: snapshot.currentIndex,
        answeredCount: snapshot.answeredCount,
        totalQuestions: snapshot.totalQuestions,
        answers: snapshot.answers,
        report: snapshot.report || ""
      });
    }

    function buildStateSnapshot(status = "draft", extra = {}) {
      const updatedAt = extra.updatedAt || new Date().toISOString();
      return {
        version: 1,
        respondentId: RESPONDENT_ID,
        respondentName: RESPONDENT_NAME,
        questionnaireId: ALIGNMENT_STORAGE_KEY,
        status: status === "submitted" ? "submitted" : "draft",
        currentIndex: typeof extra.currentIndex === "number" ? extra.currentIndex : currentIndex,
        answeredCount: answerCount(),
        totalQuestions: questions.length,
        answers,
        report: typeof extra.report === "string" ? extra.report : "",
        source: window.location.href,
        updatedAt,
        submittedAt: status === "submitted" ? (extra.submittedAt || updatedAt) : null
      };
    }

    async function syncStateToServer(status = "draft", extra = {}) {
      if (!canUseRemoteState()) return null;

      const snapshot = buildStateSnapshot(status, extra);
      const fingerprint = snapshotFingerprint(snapshot);
      if (status !== "submitted" && fingerprint === lastRemoteFingerprint) {
        return snapshot;
      }

      const response = await fetch(STATE_FUNCTION_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(snapshot)
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `State sync failed with ${response.status}`);
      }

      lastRemoteFingerprint = fingerprint;
      return payload.snapshot || snapshot;
    }

    function scheduleRemoteSync(reason) {
      if (!canUseRemoteState()) return;
      clearTimeout(remoteSyncTimer);
      remoteSyncTimer = setTimeout(async () => {
        try {
          await syncStateToServer("draft");
          saveStatus.textContent = `${reason}：${new Date().toLocaleString("zh-CN", { hour12: false })}（已同步线上）`;
        } catch (error) {
          saveStatus.textContent = `${reason}：${new Date().toLocaleString("zh-CN", { hour12: false })}（线上同步稍后重试）`;
        }
      }, REMOTE_SYNC_DELAY);
    }

    function loadDraft() {
      const raw = safeGet(ALIGNMENT_STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        answers = parsed.answers || {};
        if (typeof parsed.currentIndex === "number") {
          currentIndex = Math.min(Math.max(parsed.currentIndex, 0), questions.length);
        }
        latestLocalUpdatedAt = parsed.updatedAt || "";
        if (parsed.updatedAt) {
          saveStatus.textContent = `已恢复草稿：${new Date(parsed.updatedAt).toLocaleString("zh-CN", { hour12: false })}`;
        }
      } catch (error) {
        saveStatus.textContent = "找到草稿但无法读取，可以重新填写。";
      }
    }

    function saveDraft(reason = "已自动保存") {
      latestLocalUpdatedAt = new Date().toISOString();
      safeSet(ALIGNMENT_STORAGE_KEY, JSON.stringify({
        updatedAt: latestLocalUpdatedAt,
        currentIndex,
        answers
      }));
      saveStatus.textContent = `${reason}：${new Date().toLocaleString("zh-CN", { hour12: false })}`;
      updateProgress();
      scheduleRemoteSync(reason);
    }

    async function restoreRemoteDraft() {
      if (!canUseRemoteState()) return;

      try {
        const response = await fetch(STATE_FUNCTION_ENDPOINT, {
          headers: {
            "Accept": "application/json"
          }
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false || !payload.snapshot) {
          return;
        }

        const snapshot = payload.snapshot;
        const remoteUpdatedAt = snapshot.updatedAt || "";
        const remoteFingerprint = snapshotFingerprint(snapshot);
        lastRemoteFingerprint = remoteFingerprint;

        if (timestampValue(remoteUpdatedAt) <= timestampValue(latestLocalUpdatedAt)) {
          return;
        }

        answers = snapshot.answers || {};
        currentIndex = Math.min(Math.max(Number(snapshot.currentIndex) || 0, 0), questions.length);
        latestLocalUpdatedAt = remoteUpdatedAt;
        safeSet(ALIGNMENT_STORAGE_KEY, JSON.stringify({
          updatedAt: remoteUpdatedAt,
          currentIndex,
          answers
        }));
        if (snapshot.report) {
          safeSet(LAST_REPORT_KEY, snapshot.report);
        }
        saveStatus.textContent = `已同步线上草稿：${new Date(remoteUpdatedAt).toLocaleString("zh-CN", { hour12: false })}`;
      } catch (error) {
        // Keep the local draft flow uninterrupted even when online sync is unavailable.
      }
    }

    function scheduleSave(reason) {
      clearTimeout(saveTimer);
      saveStatus.textContent = "正在自动保存...";
      saveTimer = setTimeout(() => saveDraft(reason), 220);
    }

    function questionAnswered(question) {
      if (question.type === "radio") {
        const selected = answers[question.id] || "";
        const other = (answers[`${question.id}_other`] || "").trim();
        return Boolean(selected && (!selected.includes("其他") || other));
      }

      if (question.type === "checkbox") {
        const selected = answers[question.id] || [];
        const other = (answers[`${question.id}_other`] || "").trim();
        const needsOther = selected.some((value) => value.includes("其他"));
        return Boolean(selected.length && (!needsOther || other));
      }

      if (question.type === "textarea") {
        return Boolean((answers[question.id] || "").trim());
      }

      if (question.type === "matrix") {
        return question.rows.every((_, index) => Boolean(answers[`${question.id}_${index}`]));
      }

      if (question.type === "ranking") {
        const ranks = question.items.map((_, index) => answers[`${question.id}_${index}`]).filter(Boolean);
        return ranks.length === question.items.length && new Set(ranks).size === ranks.length;
      }

      return false;
    }

    function answerCount() {
      return questions.filter(questionAnswered).length;
    }

    function updateProgress() {
      const answered = answerCount();
      const total = questions.length;
      const percent = Math.round((answered / total) * 100);
      const displayIndex = Math.min(currentIndex + 1, total);
      progressText.textContent = currentIndex >= total
        ? `${answered} / ${total} 已回答，准备提交`
        : `第 ${displayIndex} / ${total} 题 · ${answered} 题已回答`;
      progressBar.style.setProperty("--progress", `${percent}%`);
      moduleTabs.innerHTML = modules.map((module, index) => `
        <span class="module-dot ${index === activeModuleIndex() ? "active" : ""}" style="--accent: ${module.accent}">${index + 1}. ${module.short}</span>
      `).join("");
    }

    function activeModuleIndex() {
      if (currentIndex >= questions.length) return modules.length - 1;
      return questions[currentIndex].moduleIndex;
    }

    function setAnswer(name, value) {
      answers[name] = value;
      scheduleSave();
      render();
    }

    function renderOption(question, option) {
      const label = typeof option === "string" ? option : option.label;
      const isOther = typeof option === "object" && option.other;
      const values = question.type === "checkbox" ? answers[question.id] || [] : answers[question.id] || "";
      const checked = question.type === "checkbox" ? values.includes(label) : values === label;
      return `
        <label class="option-card">
          <input type="${question.type === "checkbox" ? "checkbox" : "radio"}" name="${question.id}" value="${escapeHtml(label)}" ${checked ? "checked" : ""}>
          <span>${escapeHtml(label)}</span>
          ${isOther ? `<input class="other-input" type="text" name="${question.id}_other" value="${escapeHtml(answers[`${question.id}_other`] || "")}" placeholder="请补充">` : ""}
        </label>
      `;
    }

    function renderQuestionBody(question) {
      if (question.type === "radio" || question.type === "checkbox") {
        return `<div class="option-list">${question.options.map((option) => renderOption(question, option)).join("")}</div>`;
      }

      if (question.type === "textarea") {
        return `<textarea class="text-area" name="${question.id}" placeholder="请在这里填写你的想法">${escapeHtml(answers[question.id] || "")}</textarea>`;
      }

      if (question.type === "matrix") {
        return `
          <div class="matrix-table">
            <div class="matrix-head">
              <span>角色定位</span>
              <span>1</span>
              <span>2</span>
              <span>3</span>
              <span>4</span>
              <span>5</span>
            </div>
            ${question.rows.map((row, rowIndex) => `
              <div class="matrix-line">
                <span>${escapeHtml(row)}</span>
                ${[1, 2, 3, 4, 5].map((score) => `
                  <label aria-label="${escapeHtml(row)} ${score} 分">
                    <input type="radio" name="${question.id}_${rowIndex}" value="${score}" ${answers[`${question.id}_${rowIndex}`] === String(score) ? "checked" : ""}>
                  </label>
                `).join("")}
              </div>
            `).join("")}
          </div>
        `;
      }

      if (question.type === "ranking") {
        return `
          <div class="ranking-list">
            ${question.items.map((item, itemIndex) => `
              <label class="ranking-row">
                <span>${escapeHtml(item)}</span>
                <select class="rank-select" name="${question.id}_${itemIndex}">
                  <option value="">排序</option>
                  ${question.items.map((_, rankIndex) => {
                    const rank = String(rankIndex + 1);
                    return `<option value="${rank}" ${answers[`${question.id}_${itemIndex}`] === rank ? "selected" : ""}>第 ${rank}</option>`;
                  }).join("")}
                </select>
              </label>
            `).join("")}
          </div>
          <p class="helper">每个排序数字只能使用一次。</p>
        `;
      }

      return "";
    }

    function typeLabel(question) {
      return {
        radio: "单选",
        checkbox: "多选",
        textarea: "开放题",
        matrix: "矩阵评分 1-5",
        ranking: "排序题"
      }[question.type] || "Question";
    }

    function renderQuestion() {
      const question = questions[currentIndex];
      wizardMount.innerHTML = `
        <section class="question-card" style="--accent: ${question.module.accent}">
          <div class="question-head">
            <div class="question-meta">
              <span class="pill">${escapeHtml(question.module.title)}</span>
              <span>${typeLabel(question)}</span>
            </div>
            <h2>${escapeHtml(question.title)}</h2>
            <p class="helper">${escapeHtml(question.module.note)}</p>
          </div>
          <div class="question-body">
            ${renderQuestionBody(question)}
          </div>
          <div class="wizard-actions">
            <div class="action-group">
              <button class="button" type="button" data-action="prev" ${currentIndex === 0 ? "disabled" : ""}>上一题</button>
              <button class="button" type="button" data-action="save">保存草稿</button>
            </div>
            <div class="action-group">
              <button class="button danger" type="button" data-action="clear">清空草稿</button>
              <button class="button primary" type="button" data-action="next" ${questionAnswered(question) ? "" : "disabled"}>${currentIndex === questions.length - 1 ? "查看提交" : "下一题"}</button>
            </div>
          </div>
        </section>
      `;
      bindQuestionEvents(question);
    }

    function renderFinal() {
      const recipient = safeGet(RECIPIENT_STORAGE_KEY) || DEFAULT_REPORT_EMAIL;
      wizardMount.innerHTML = `
        <section class="final-card">
          <div>
            <div class="eyebrow">Submit</div>
            <h2>提交前确认</h2>
            <p>感谢你认真填写这份表单。这份表单不是形式流程，而是用于更准确地理解彼此对方向、角色、投入方式和长期合作结构的判断。点击下方按钮后，页面会生成完整报告并自动发送给 Yik；如果当前只是本地文件预览，页面会复制报告并打开邮件草稿作为备用。</p>
          </div>
          <div class="submit-grid">
            <label class="field-label">
              Report recipient email（Yik）
              <input class="text-input" id="reportRecipient" type="email" value="${escapeHtml(recipient)}">
            </label>
            <button class="button primary" type="button" data-action="submit">生成报告并发送给 Yik</button>
          </div>
          <div class="wizard-actions">
            <div class="action-group">
              <button class="button" type="button" data-action="prev">返回上一题</button>
              <button class="button" type="button" data-action="save">保存草稿</button>
            </div>
            <div class="action-group">
              <button class="button danger" type="button" data-action="clear">清空草稿</button>
            </div>
          </div>
          <div class="report-preview" id="reportPreview" hidden>
            <button class="button" type="button" data-action="copy">复制完整报告</button>
            <textarea class="report-output" id="reportOutput" readonly></textarea>
          </div>
        </section>
      `;
      document.getElementById("reportRecipient").addEventListener("input", (event) => {
        safeSet(RECIPIENT_STORAGE_KEY, event.target.value.trim());
      });
    }

    function bindQuestionEvents(question) {
      wizardMount.querySelectorAll("input, textarea, select").forEach((field) => {
        field.addEventListener("input", () => handleFieldChange(question, field));
        field.addEventListener("change", () => handleFieldChange(question, field));
      });
    }

    function handleFieldChange(question, field) {
      if (field.type === "checkbox") {
        const selected = answers[field.name] || [];
        answers[field.name] = field.checked
          ? [...new Set([...selected, field.value])]
          : selected.filter((value) => value !== field.value);
      } else {
        answers[field.name] = field.value;
      }

      scheduleSave();

      const shouldRenderQuestion = (question.type === "radio" && field.type === "radio")
        || question.type === "matrix"
        || question.type === "ranking";

      if (shouldRenderQuestion) {
        render();
      } else {
        updateProgress();
        const nextButton = wizardMount.querySelector('[data-action="next"]');
        if (nextButton) nextButton.disabled = !questionAnswered(question);
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
      } else {
        currentIndex = questions.length;
      }
      saveDraft();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function previousQuestion() {
      if (currentIndex > 0) {
        currentIndex -= 1;
      }
      saveDraft();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearDraft() {
      if (!confirm("确定要清空当前问卷草稿吗？")) return;
      answers = {};
      currentIndex = 0;
      latestLocalUpdatedAt = new Date().toISOString();
      lastRemoteFingerprint = "";
      safeRemove(ALIGNMENT_STORAGE_KEY);
      safeRemove(LAST_REPORT_KEY);
      saveStatus.textContent = "草稿已清空";
      if (canUseRemoteState()) {
        clearTimeout(remoteSyncTimer);
        syncStateToServer("draft", { report: "", updatedAt: latestLocalUpdatedAt, currentIndex: 0 }).catch(() => {});
      }
      render();
    }

    function formatSimpleAnswer(question) {
      const value = answers[question.id];
      const other = (answers[`${question.id}_other`] || "").trim();
      if (Array.isArray(value)) {
        const selected = [...value];
        if (other) selected.push(`其他补充：${other}`);
        return selected.length ? selected.join("\n") : "未填写";
      }
      return [value, other ? `其他补充：${other}` : ""].filter(Boolean).join("\n") || "未填写";
    }

    function formatMatrixAnswer(question) {
      return question.rows
        .map((row, index) => `${row}: ${answers[`${question.id}_${index}`] || "未填写"} / 5`)
        .join("\n");
    }

    function formatRankingAnswer(question) {
      return question.items
        .map((item, index) => ({ item, rank: answers[`${question.id}_${index}`] || "未填写" }))
        .sort((a, b) => (Number(a.rank) || 99) - (Number(b.rank) || 99))
        .map((entry) => `${entry.rank === "未填写" ? "未填写" : `第 ${entry.rank}`} - ${entry.item}`)
        .join("\n");
    }

    function formatAnswer(question) {
      if (question.type === "matrix") return formatMatrixAnswer(question);
      if (question.type === "ranking") return formatRankingAnswer(question);
      return formatSimpleAnswer(question);
    }

    function buildReport() {
      const lines = [
        "Rivex / Jim Role & Cooperation Confirmation Form",
        `Submitted at: ${new Date().toLocaleString("zh-CN", { hour12: false })}`,
        "",
        "说明：这份报告由 Jim 问卷页面生成，答案来自当前问卷保存记录，并已同步到线上管理端。",
        ""
      ];

      modules.forEach((module, index) => {
        lines.push("==============================");
        lines.push(`${index + 1}. ${module.title}`);
        lines.push("==============================");
        module.questions.forEach((question) => {
          lines.push("");
          lines.push(question.title);
          lines.push(formatAnswer(question));
        });
        lines.push("");
      });

      return lines.join("\n");
    }

    async function copyReport(text) {
      const output = document.getElementById("reportOutput");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else if (output) {
          output.value = text;
          output.focus();
          output.select();
          document.execCommand("copy");
        }
        saveStatus.textContent = "完整报告已复制，可直接粘贴到邮件或聊天中。";
      } catch (error) {
        saveStatus.textContent = "报告已生成，复制可能需要手动选择文本。";
      }
    }

    function openEmailDraft(recipient, report) {
      const subject = "Rivex / Jim Role & Cooperation Confirmation Form";
      const fullMailto = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(report)}`;
      if (fullMailto.length < 22000) {
        window.location.href = fullMailto;
        return;
      }

      const shorterBody = [
        "Hi Yik,",
        "",
        "Jim has completed the Rivex / Jim Role & Cooperation Confirmation Form.",
        "The full report was generated and copied from the page. Please paste the copied report into this email before sending.",
        "",
        "Best,"
      ].join("\n");
      window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shorterBody)}`;
    }

    async function sendReportEmail(recipient, report, submittedAt) {
      if (window.location.protocol === "file:") {
        throw new Error("本地文件预览无法调用 Netlify Function");
      }

      const response = await fetch(EMAIL_FUNCTION_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          recipient,
          report,
          submittedAt,
          source: window.location.href
        })
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `Email function failed with ${response.status}`);
      }

      return payload;
    }

    async function submitReport() {
      const recipientField = document.getElementById("reportRecipient");
      const submitButton = wizardMount.querySelector('[data-action="submit"]');
      const recipient = (recipientField?.value || DEFAULT_REPORT_EMAIL).trim();
      if (!recipient) {
        saveStatus.textContent = "请先填写 Yik 的收件邮箱。";
        recipientField?.focus();
        return;
      }

      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "正在生成并发送...";
      }

      safeSet(RECIPIENT_STORAGE_KEY, recipient);
      saveDraft("提交前已保存");
      const report = buildReport();
      const submittedAt = new Date().toISOString();
      safeSet(LAST_REPORT_KEY, report);
      const preview = document.getElementById("reportPreview");
      const output = document.getElementById("reportOutput");
      if (preview && output) {
        output.value = report;
        preview.hidden = false;
      }

      try {
        clearTimeout(remoteSyncTimer);
        await syncStateToServer("submitted", {
          report,
          submittedAt,
          currentIndex: questions.length,
          updatedAt: submittedAt
        });
        saveStatus.textContent = "正在发送报告给 Yik...";
        const result = await sendReportEmail(recipient, report, submittedAt);
        saveStatus.textContent = `报告已发送到 ${result.recipient || recipient}。`;
      } catch (error) {
        await copyReport(report);
        saveStatus.textContent = `自动发送未完成：${error.message}。完整报告已复制，并将打开邮件草稿作为备用。`;
        openEmailDraft(recipient, report);
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "生成报告并发送给 Yik";
        }
      }
    }

    function render() {
      updateProgress();
      if (currentIndex >= questions.length) {
        renderFinal();
      } else {
        renderQuestion();
      }
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "next") nextQuestion();
      if (action === "prev") previousQuestion();
      if (action === "save") saveDraft("已手动保存");
      if (action === "clear") clearDraft();
      if (action === "submit") submitReport();
      if (action === "copy") copyReport(document.getElementById("reportOutput")?.value || buildReport());
    });

    const urlParams = new URLSearchParams(window.location.search);
    const recipientFromUrl = urlParams.get("to") || urlParams.get("email");
    if (recipientFromUrl) {
      safeSet(RECIPIENT_STORAGE_KEY, recipientFromUrl);
    }

    async function initializeQuestionnaire() {
      loadDraft();
      render();
      await restoreRemoteDraft();
      render();
    }

    initializeQuestionnaire();
  </script>
</body>
</html>
